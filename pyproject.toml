[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery-scheduling-lab"
version = "0.1.0"
description = "Dependency-free teaching models for lottery scheduling and dining philosophers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Educational use" }
dependencies = []

[project.optional-dependencies]
docs = ["Pillow>=10,<12"]
media = ["Pillow>=10,<12", "imageio-ffmpeg>=0.5", "arabic-reshaper>=3", "python-bidi>=0.4"]
seminar = ["python-pptx>=0.6.23,<2"]
reports = ["python-docx>=1.1", "reportlab>=4", "pypdf>=5", "arabic-reshaper>=3", "python-bidi>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]
