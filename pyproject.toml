[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery-scheduling-lab"
version = "0.1.0"
description = "Dependency-free teaching models for lottery scheduling and dining philosophers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Educational use" }
dependencies = []

[project.optional-dependencies]
docs = ["Pillow>=10,<12"]

[tool.setuptools.packages.find]
where = ["src"]
