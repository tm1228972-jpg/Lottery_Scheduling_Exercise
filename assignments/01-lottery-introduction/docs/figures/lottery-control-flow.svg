<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Lottery scheduling control flow</title>
<desc id="desc">Educational diagram for the Lottery Scheduling Exercise.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#64748B" stroke-width="1.8"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#14243A" flood-opacity="0.10"/></filter>
</defs>
<rect width="100%" height="100%" fill="#F8FAFC"/>
<text x="60" y="58" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#14243A">One lottery dispatch: control flow</text><text x="60" y="90" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="17" fill="#64748B">The implementation uses cumulative ticket intervals and a seeded pseudo-random generator.</text><g filter="url(#shadow)"><rect x="85" y="155" width="300" height="90" rx="18" fill="#FFFFFF" stroke="#4776A8" stroke-width="2.5"/><rect x="85" y="155" width="10" height="90" rx="5" fill="#4776A8"/><text x="113" y="197" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">1 · Validate ready set</text><text x="113" y="230" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">At least one process; ticket count &gt; 0</text></g><g filter="url(#shadow)"><rect x="455" y="155" width="300" height="90" rx="18" fill="#FFFFFF" stroke="#168C8C" stroke-width="2.5"/><rect x="455" y="155" width="10" height="90" rx="5" fill="#168C8C"/><text x="483" y="197" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">2 · Compute T</text><text x="483" y="230" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">T = sum of runnable ticket counts</text></g><g filter="url(#shadow)"><rect x="825" y="155" width="300" height="90" rx="18" fill="#FFFFFF" stroke="#F2B84B" stroke-width="2.5"/><rect x="825" y="155" width="10" height="90" rx="5" fill="#F2B84B"/><text x="853" y="197" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">3 · Draw k</text><text x="853" y="230" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">Uniform integer from 1 through T</text></g><g filter="url(#shadow)"><rect x="825" y="340" width="300" height="90" rx="18" fill="#FFFFFF" stroke="#DF6B63" stroke-width="2.5"/><rect x="825" y="340" width="10" height="90" rx="5" fill="#DF6B63"/><text x="853" y="382" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">4 · Map interval</text><text x="853" y="415" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">First cumulative total ≥ k</text></g><g filter="url(#shadow)"><rect x="455" y="340" width="300" height="90" rx="18" fill="#FFFFFF" stroke="#4776A8" stroke-width="2.5"/><rect x="455" y="340" width="10" height="90" rx="5" fill="#4776A8"/><text x="483" y="382" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">5 · Dispatch owner</text><text x="483" y="415" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">Return winner and draw trace</text></g><g filter="url(#shadow)"><rect x="85" y="340" width="300" height="90" rx="18" fill="#FFFFFF" stroke="#168C8C" stroke-width="2.5"/><rect x="85" y="340" width="10" height="90" rx="5" fill="#168C8C"/><text x="113" y="382" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">6 · Next decision</text><text x="113" y="415" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">Repeat when another choice is needed</text></g><path d="M385,200 L455,200" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M755,200 L825,200" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M975,245 L975,340" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M825,385 L755,385" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M455,385 L385,385" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="485" width="1045" height="60" rx="14" fill="#FFF5DF" stroke="#EED69E"/><text x="602" y="523" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="17" fill="#25364B">A ticket ratio is an expectation over repeated draws, not a promise about any finite prefix.</text>
</svg>