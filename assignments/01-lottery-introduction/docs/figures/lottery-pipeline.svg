<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Lottery scheduling dispatch pipeline</title>
<desc id="desc">Educational diagram for the Lottery Scheduling Exercise.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#64748B" stroke-width="1.8"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#14243A" flood-opacity="0.10"/></filter>
</defs>
<rect width="100%" height="100%" fill="#F8FAFC"/>
<text x="60" y="56" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#14243A">Lottery scheduling: dispatch pipeline</text><text x="60" y="88" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="17" fill="#64748B">A positive ticket weight gives a proportional chance at each independent draw.</text><g filter="url(#shadow)"><rect x="55" y="180" width="230" height="112" rx="18" fill="#FFFFFF" stroke="#4776A8" stroke-width="2.5"/><rect x="55" y="180" width="10" height="112" rx="5" fill="#4776A8"/><text x="83" y="222" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">Ready processes</text><text x="83" y="255" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">Pᵢ with positive tickets</text></g><g filter="url(#shadow)"><rect x="345" y="180" width="230" height="112" rx="18" fill="#FFFFFF" stroke="#168C8C" stroke-width="2.5"/><rect x="345" y="180" width="10" height="112" rx="5" fill="#168C8C"/><text x="373" y="222" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">Ticket pool</text><text x="373" y="255" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">Disjoint intervals; T = Σ tᵢ</text></g><g filter="url(#shadow)"><rect x="635" y="180" width="230" height="112" rx="18" fill="#FFFFFF" stroke="#F2B84B" stroke-width="2.5"/><rect x="635" y="180" width="10" height="112" rx="5" fill="#F2B84B"/><text x="663" y="222" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">Random draw</text><text x="663" y="255" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">Choose integer k ∈ [1, T]</text></g><g filter="url(#shadow)"><rect x="925" y="180" width="230" height="112" rx="18" fill="#FFFFFF" stroke="#DF6B63" stroke-width="2.5"/><rect x="925" y="180" width="10" height="112" rx="5" fill="#DF6B63"/><text x="953" y="222" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">Dispatch winner</text><text x="953" y="255" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">Run one modeled time slice</text></g><path d="M290,236 L335,236" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M580,236 L625,236" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M870,236 L915,236" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="210" y="385" width="780" height="105" rx="16" fill="#E8F2F3" stroke="#B8D9D8"/><text x="600" y="428" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14243A">Update the ready set, then repeat</text><text x="600" y="460" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">Blocking, completion, and ticket changes are outside this minimal model.</text><path d="M1040,292 L1040,436" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M210,436 L170,436" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M170,436 L170,235" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M170,235 L55,235" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><text x="60" y="550" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748B">Educational model — not an operating-system kernel scheduler.</text>
</svg>