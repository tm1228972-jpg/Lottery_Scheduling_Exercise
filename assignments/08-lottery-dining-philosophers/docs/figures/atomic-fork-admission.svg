<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Dining philosophers atomic admission</title>
<desc id="desc">Educational diagram for the Lottery Scheduling Exercise.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#64748B" stroke-width="1.8"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#14243A" flood-opacity="0.10"/></filter>
</defs>
<rect width="100%" height="100%" fill="#F8FAFC"/>
<text x="55" y="55" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#14243A">Dining philosophers: safe atomic admission</text><text x="55" y="88" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="17" fill="#64748B">The arbiter reserves both neighboring forks at once; no process waits while holding one fork.</text><rect x="390" y="190" width="420" height="215" rx="24" fill="#EAF3F4" stroke="#168C8C" stroke-width="3" filter="url(#shadow)"/><text x="600" y="238" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#14243A">Central arbiter</text><text x="600" y="274" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="17" fill="#25364B">check both forks → grant atomically</text><text x="600" y="307" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">lottery among safe candidates</text><text x="600" y="348" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#25364B">release both when the finite meal ends</text><rect x="65" y="160" width="210" height="88" rx="16" fill="#FFFFFF" stroke="#4776A8" stroke-width="2.5"/><text x="170" y="194" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">P0</text><text x="170" y="223" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748B">requests F4 + F0</text><rect x="65" y="360" width="210" height="88" rx="16" fill="#FFFFFF" stroke="#4776A8" stroke-width="2.5"/><text x="170" y="394" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">P1</text><text x="170" y="423" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748B">requests F0 + F1</text><rect x="930" y="160" width="210" height="88" rx="16" fill="#FFFFFF" stroke="#4776A8" stroke-width="2.5"/><text x="1035" y="194" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">P2</text><text x="1035" y="223" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748B">requests F1 + F2</text><rect x="930" y="360" width="210" height="88" rx="16" fill="#FFFFFF" stroke="#4776A8" stroke-width="2.5"/><text x="1035" y="394" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">P3</text><text x="1035" y="423" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748B">requests F2 + F3</text><path d="M275,204 L390,235" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><text x="332.5" y="209.5" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748B">request</text><path d="M275,404 L390,350" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><text x="332.5" y="367.0" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748B">request</text><path d="M810,235 L930,204" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><text x="870.0" y="209.5" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748B">grant / release</text><path d="M810,350 L930,404" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><text x="870.0" y="367.0" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748B">grant / release</text><text x="600" y="485" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#DF6B63">This prevents circular wait in the modeled admission path; lottery alone does not.</text><text x="600" y="522" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="15" fill="#64748B">The diagram shows four sample philosophers; the simulator defaults to five.</text>
</svg>