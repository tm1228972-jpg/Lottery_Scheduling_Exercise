<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">Lottery aging override flow</title>
<desc id="desc">Educational diagram for the Lottery Scheduling Exercise.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#64748B" stroke-width="1.8"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#14243A" flood-opacity="0.10"/></filter>
</defs>
<rect width="100%" height="100%" fill="#F8FAFC"/>
<text x="55" y="55" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#14243A">Lottery + age override: one round</text><text x="55" y="88" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="17" fill="#64748B">Safety comes from the arbiter; a deterministic wait-age override supplies the modeled fairness policy.</text><g filter="url(#shadow)"><rect x="60" y="160" width="260" height="100" rx="18" fill="#FFFFFF" stroke="#4776A8" stroke-width="2.5"/><rect x="60" y="160" width="10" height="100" rx="5" fill="#4776A8"/><text x="88" y="202" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">Start round</text><text x="88" y="235" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">All philosophers hungry; forks free</text></g><path d="M320 210 L390 210" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><polygon points="500,140 610,210 500,280 390,210" fill="#FFF5DF" stroke="#F2B84B" stroke-width="2.5"/><text x="500" y="204" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#14243A">Any age ≥</text><text x="500" y="229" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#14243A">threshold?</text><g filter="url(#shadow)"><rect x="700" y="130" width="255" height="92" rx="18" fill="#FFFFFF" stroke="#DF6B63" stroke-width="2.5"/><rect x="700" y="130" width="10" height="92" rx="5" fill="#DF6B63"/><text x="728" y="172" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">Yes · oldest wait</text><text x="728" y="205" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">Grant this philosopher first</text></g><g filter="url(#shadow)"><rect x="700" y="270" width="255" height="92" rx="18" fill="#FFFFFF" stroke="#168C8C" stroke-width="2.5"/><rect x="700" y="270" width="10" height="92" rx="5" fill="#168C8C"/><text x="728" y="312" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">No · lottery</text><text x="728" y="345" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">Choose weighted safe candidate</text></g><path d="M610 195 L700 176" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><text x="656" y="172" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748B">yes</text><path d="M500 280 L500 316 L700 316" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><text x="519" y="306" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748B">no</text><g filter="url(#shadow)"><rect x="1000" y="190" width="160" height="110" rx="18" fill="#FFFFFF" stroke="#4776A8" stroke-width="2.5"/><rect x="1000" y="190" width="10" height="110" rx="5" fill="#4776A8"/><text x="1028" y="232" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14243A">Atomic grant</text><text x="1028" y="265" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748B">Reserve both forks</text></g><path d="M955 176 L1000 220" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M955 316 L1000 270" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="120" y="410" width="960" height="92" rx="18" fill="#EDF5F5" stroke="#B7D4D4"/><text x="600" y="449" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#14243A">Finite meal → release both forks → reset served age; increment others</text><text x="600" y="480" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="15" fill="#64748B">With finite philosophers and finite rounds, the threshold override bounds bypasses in this model.</text><path d="M1080 300 L1080 455 L1080 455" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>